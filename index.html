<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amiibo 傳輸工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg2:#121212;--bg3:#1a1a1a;--bg4:#222;
  --border:#282828;--border2:#383838;
  --red:#e60012;--red2:#cc0010;
  --txt:#f0f0f0;--txt2:#b0b0b0;--txt3:#707070;--txt4:#484848;
  --blue:#5aacff;--green:#4caf50;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow:hidden}

/* ══ HEADER ══ */
header{
  height:56px;background:var(--bg3);border-bottom:1.5px solid var(--border2);
  display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:10;
}
.logo{font-size:24px}
.title-wrap h1{font-size:16px;font-weight:700;line-height:1.2;color:#fff}
.title-wrap small{font-size:11px;color:var(--txt3);display:block}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-sm{
  display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;
  font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);
  background:transparent;color:var(--txt2);transition:all .15s;white-space:nowrap;
}
.btn-sm:hover{background:var(--bg4);color:var(--txt)}
.btn-sm.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm.primary:hover{background:var(--red2)}
.api-badge{font-size:11px;padding:4px 8px;border-radius:5px;background:#1a2e1a;color:var(--green);font-weight:500}

/* ══ LAYOUT ══ */
.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 56px)}

/* ══ SIDEBAR ══ */
.sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;display:flex;flex-direction:column;
}
.sidebar-top{padding:10px 10px 6px;flex-shrink:0}
.search-side{
  width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;
  padding:7px 10px;color:var(--txt);font-size:12px;outline:none;
}
.search-side:focus{border-color:var(--red)}
.search-side::placeholder{color:var(--txt4)}
.sidebar-title{font-size:10px;font-weight:700;color:var(--txt4);text-transform:uppercase;letter-spacing:.08em;padding:8px 12px 4px}
.cat-item{cursor:pointer;user-select:none}
.cat-header{
  display:flex;align-items:center;gap:7px;padding:7px 12px;
  font-size:12px;color:var(--txt2);transition:background .12s;
}
.cat-header:hover{background:var(--bg3)}
.cat-header.active{background:var(--bg4);color:#fff;font-weight:600}
.cat-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.cat-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-count{font-size:10px;color:var(--txt4);flex-shrink:0}
.cat-caret{font-size:9px;color:var(--txt4);transition:transform .15s;flex-shrink:0}
.cat-header.open .cat-caret{transform:rotate(90deg)}
.sub-list{display:none}
.sub-list.open{display:block}
.sub-item{
  display:flex;align-items:center;gap:5px;padding:5px 12px 5px 34px;
  font-size:11px;color:var(--txt3);cursor:pointer;transition:background .12s;
}
.sub-item:hover{background:var(--bg3);color:var(--txt2)}
.sub-item.active{background:#1a1a2e;color:var(--blue);font-weight:600}
.sub-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══ MAIN ══ */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.search-main{
  flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:7px;
  padding:8px 12px;color:var(--txt);font-size:13px;outline:none;
}
.search-main:focus{border-color:var(--red)}
.search-main::placeholder{color:var(--txt4)}
.breadcrumb{padding:6px 14px;font-size:11px;color:var(--txt4);background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}

/* ══ GRID ══ */
.grid-area{flex:1;overflow-y:auto;padding:14px}
.section-hd{
  font-size:11px;font-weight:700;color:var(--txt4);text-transform:uppercase;letter-spacing:.07em;
  padding:4px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-bottom:20px}

/* ══ CARD ══ */
.card{
  background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 8px 8px;text-align:center;cursor:pointer;
  transition:all .15s;position:relative;overflow:hidden;
}
.card:hover{background:var(--bg4);border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 20px rgba(230,0,18,.2)}
.card.selected{background:#141424;border-color:var(--blue);box-shadow:0 0 0 2px rgba(90,172,255,.25)}
.card.no-file{opacity:.5}
.card.no-file:hover{opacity:.8}
.card-img-wrap{width:70px;height:70px;margin:0 auto 6px;position:relative;display:flex;align-items:center;justify-content:center}
.card-img{width:70px;height:70px;object-fit:contain;position:absolute;inset:0;opacity:0;transition:opacity .2s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.card-img.loaded{opacity:1}
.card-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;transition:opacity .2s}
.card-img.loaded ~ .card-emoji,.card-img.loaded + .card-emoji{opacity:0}
.card-name{font-size:10px;color:var(--txt2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-zh{font-size:10px;color:var(--txt3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-badge{position:absolute;top:4px;right:4px;font-size:8px;padding:1px 4px;border-radius:3px;background:#1a3a1a;color:var(--green);font-weight:bold}
.card-badge.missing{background:#2e1a1a;color:#f44336}

/* ══ EMPTY ══ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:250px;gap:10px;color:var(--txt4);text-align:center}
.empty .ei{font-size:40px}
.empty p{font-size:13px;color:var(--txt3)}

/* ══ BOTTOM ══ */
.bottom{
  background:var(--bg3);border-top:1.5px solid var(--border2);
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.bottom-preview{width:44px;height:44px;object-fit:contain;flex-shrink:0;display:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.bottom-preview.show{display:block}
.bottom-info{flex:1;min-width:0}
.bottom-label{font-size:10px;color:var(--txt4);text-transform:uppercase;letter-spacing:.06em}
.bottom-name{font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-path{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.btn-pick{
  display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:7px;
  border:1px solid var(--border2);background:transparent;color:var(--txt2);
  font-size:12px;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;
}
.btn-pick:hover{border-color:var(--txt);color:#fff}
.btn-send{
  display:flex;align-items:center;gap:6px;padding:9px 20px;border-radius:7px;
  background:var(--red);border:none;color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;
}
.btn-send:hover:not(:disabled){background:var(--red2)}
.btn-send:disabled{opacity:.35;cursor:not-allowed}

/* ══ LOG ══ */
.log{background:#0d0d0d;border-top:1px solid var(--border);padding:5px 16px;font-size:11px;color:var(--txt3);font-family:monospace;flex-shrink:0}
.log.ok{color:var(--green)}.log.err{color:#f44336}.log.busy{color:#ffb300}

/* ══ TOAST ══ */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);border:1px solid var(--border2);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#manualInput,#folderInput{display:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>

function getZh(name){
  if(ZH[name]) return ZH[name];
  const m = name.match(/ - (.+)$/);
  if(m && ZH[m[1]]) return ZH[m[1]];
  return '';
}
function getEmoji(name){
  const n=name.toLowerCase();
  if(/mario|luigi|peach|toad|bowser/.test(n)) return '🍄';
  if(/link|zelda|ganon/.test(n)) return '🗡️';
  if(/pikachu|pokemon|charizard|mewtwo|greninja/.test(n)) return '⚡';
  if(/kirby|dedede|meta knight/.test(n)) return '⭐';
  if(/samus|metroid/.test(n)) return '🚀';
  if(/fox|falco/.test(n)) return '🦊';
  if(/donkey kong|diddy/.test(n)) return '🦍';
  if(/inkling|splatoon|octoling/.test(n)) return '🦑';
  if(/sonic/.test(n)) return '💨';
  if(/mega man/.test(n)) return '🤖';
  if(/isabelle|tom nook|k\.k/.test(n)) return '🏝️';
  if(/yoshi/.test(n)) return '🥚';
  if(/key|secret|essential/.test(n)) return '🔑';
  if(/yu.gi|yugi/.test(n)) return '🃏';
  return '🎮';
}

//  分類樹與過濾狀態
// ═══════════════════════════════════════
let curSeries = null;
let curSub = null;
let mainQ = '';
let sideQ = '';

function buildTree(){
  const tree = {};
  for(const r of DB){
    if(!tree[r.series]) tree[r.series]={};
    const sub = r.sub||'全部';
    if(!tree[r.series][sub]) tree[r.series][sub]=0;
    tree[r.series][sub]++;
  }
  window._tree = tree;
  renderTree();
}

function renderTree(){
  const q = sideQ.toLowerCase();
  const tree = window._tree;
  const el = document.getElementById('catTree');
  el.innerHTML='';

  if(!q || '全部'.includes(q)){
    const a = mk('div','cat-header'+(curSeries===null?' active':''));
    a.innerHTML=`<span class="cat-icon">🎮</span><span class="cat-label">全部</span><span class="cat-count">${DB.length}</span>`;
    a.onclick=()=>{curSeries=curSub=null;setActive(a);renderGrid();};
    el.appendChild(a);
  }

  for(const [series, subs] of Object.entries(tree)){
    if(q && !series.toLowerCase().includes(q)) continue;
    const icon = ICONS[series]||'📁';
    const total = Object.values(subs).reduce((a,b)=>a+b,0);
    const wrap = mk('div','cat-item');
    const header = mk('div','cat-header'+(curSeries===series?' active':''));
    const subKeys = Object.keys(subs);
    const hasMulti = subKeys.length>1 || (subKeys.length===1 && subKeys[0]!=='全部');
    header.innerHTML=`<span class="cat-icon">${icon}</span><span class="cat-label">${series.replace(/ Amiibo$/,'')}</span><span class="cat-count">${total}</span>${hasMulti?'<span class="cat-caret">▶</span>':''}`;
    const subList = mk('div','sub-list'+(curSeries===series?' open':''));

    if(hasMulti){
      header.onclick=()=>{
        const open=subList.classList.toggle('open');
        header.classList.toggle('open',open);
        setActive(header);
        curSeries=series;curSub=null;
        renderGrid();
      };
      for(const [sub,cnt] of Object.entries(subs)){
        const si = mk('div','sub-item'+(curSeries===series&&curSub===sub?' active':''));
        si.innerHTML=`<span class="sub-label">${sub}</span><span class="cat-count">${cnt}</span>`;
        si.onclick=(e)=>{e.stopPropagation();setSubActive(si);curSeries=series;curSub=sub;renderGrid();};
        subList.appendChild(si);
      }
    } else {
      header.onclick=()=>{setActive(header);curSeries=series;curSub=null;renderGrid();};
    }
    wrap.appendChild(header);
    wrap.appendChild(subList);
    el.appendChild(wrap);
  }
}

function setActive(el){
  document.querySelectorAll('.cat-header').forEach(h=>h.classList.remove('active'));
  el.classList.add('active');
}
function setSubActive(el){
  document.querySelectorAll('.sub-item').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}

//  渲染卡片格線
// ═══════════════════════════════════════
function getFiltered(){
  let rows = DB;
  if(curSeries) rows = rows.filter(r=>r.series===curSeries);
  if(curSub) rows = rows.filter(r=>(r.sub||'全部')===curSub);
  if(mainQ){
    const q=mainQ.toLowerCase();
    rows = rows.filter(r=>r.name.toLowerCase().includes(q)||getZh(r.name).toLowerCase().includes(q));
  }
  return rows;
}

function renderGrid(){
  const rows = getFiltered();
  const el = document.getElementById('gridArea');

  let bc = curSeries ? curSeries.replace(/ Amiibo$/,'') : '全部系列';
  if(curSub) bc += ` › ${curSub}`;
  if(mainQ) bc = `搜尋「${mainQ}」`;
  document.getElementById('breadcrumb').textContent = `${bc} · ${rows.length} 個`;

  if(!rows.length){
    el.innerHTML='<div class="empty"><span class="ei">🔍</span><p>找不到符合的 Amiibo</p></div>';
    return;
  }

  const groups = {};
  for(const r of rows){
    const g = mainQ||!curSeries ? r.series : (curSub?curSub:r.sub||'其他');
    if(!groups[g]) groups[g]=[];
    groups[g].push(r);
  }

  let html='';
  for(const [gname, items] of Object.entries(groups)){
    if(Object.keys(groups).length>1){
      const icon=ICONS[gname]||'📁';
      html+=`<div class="section-hd">${icon} ${gname.replace(/ Amiibo$/,'')}</div>`;
    }
    html+='<div class="grid">';
    for(const r of items){
      const hasFile = !!localFileMap[r.path];
      const isSel = selectedEntry && selectedEntry.path===r.path;
      const zh = getZh(r.name);
      const emoji = getEmoji(r.name);
      const disp = r.name.replace(/^\[AC\] \d+ - /,'').replace(/^\[.*?\] /,'');
      html+=`<div class="card${isSel?' selected':''}${!hasFile&&Object.keys(localFileMap).length>0?' no-file':''}" data-path="${esc(r.path)}">
        ${hasFile?'<span class="card-badge">✓</span>':Object.keys(localFileMap).length>0?'<span class="card-badge missing">✗</span>':''}
        <div class="card-img-wrap">
          ${r.img ? `<img class="card-img" data-src="${esc(r.img)}" src="" alt="">` : ''}
          <div class="card-emoji">${emoji}</div>
        </div>
        <div class="card-name">${escH(disp)}</div>
        ${zh?`<div class="card-zh">${escH(zh)}</div>`:''}
      </div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html;

  el.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=>{
      const path=card.dataset.path;
      const rec=DB.find(r=>r.path===path);
      if(rec) selectEntry(rec);
    });
  });
  lazyImg();
}

// ═══════════════════════════════════════
//  高效圖片懶加載
// ═══════════════════════════════════════
let observer;
function lazyImg(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    for(const e of entries){
      if(!e.isIntersecting) continue;
      const img=e.target;
      if(img.dataset.loaded) continue;
      const src=img.dataset.src;
      if(src){
        img.onload=()=>{img.classList.add('loaded');img.dataset.loaded='1';};
        img.onerror=()=>{img.dataset.loaded='err';};
        img.src=src;
      }
      observer.unobserve(img);
    }
  },{rootMargin:'100px'});
  document.querySelectorAll('.card-img:not([data-loaded])').forEach(img=>observer.observe(img));
}

// ═══════════════════════════════════════
//  選取項目
// ═══════════════════════════════════════
function selectEntry(rec){
  selectedEntry = rec;
  const file = localFileMap[rec.path]||null;
  document.getElementById('botName').textContent = rec.name+'.bin';
  document.getElementById('botPath').textContent = file ? '✅ 本地檔案已連結：'+rec.path : '⚠️ 尚未連結本地資料夾，請點右上角「更新資料夾」';
  document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>b.disabled=!file);

  const prev=document.getElementById('bottomPreview');
  if(rec.img){
    prev.src=rec.img;prev.className='bottom-preview show';
  } else {
    prev.className='bottom-preview';
  }

  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.path===rec.path));
  if(!file) showToast('⚠️ 請先點「更新資料夾」連結本地 bin 檔案才能傳送');
}

// ═══════════════════════════════════════
//  開啟 / 更新本地資料夾
// ═══════════════════════════════════════
document.getElementById('addFolderBtn').onclick=()=>document.getElementById('folderInput').click();
document.getElementById('folderInput').addEventListener('change',e=>{
  const files=Array.from(e.target.files).filter(f=>f.name.endsWith('.bin'));
  if(!files.length){setLog('未找到 .bin 檔案','err');return;}
  localFileMap={};
  for(const f of files){
    const rel=f.webkitRelativePath||f.name;
    const idx=rel.indexOf('Amiibo Bin/');
    const key = idx!==-1 ? rel.slice(idx+'Amiibo Bin/'.length) : rel;
    localFileMap[key]=f;
  }
  const matched=DB.filter(r=>localFileMap[r.path]).length;
  setLog(`📂 已掃描 ${files.length} 個檔案，比對成功 ${matched}/${DB.length} 筆`,'ok');
  showToast(`✅ 已連結 ${matched} 個 Amiibo 檔案`);
  renderGrid();
  if(selectedEntry){
    const f=localFileMap[selectedEntry.path];
    document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>b.disabled=!f);
    document.getElementById('botPath').textContent=f?'✅ 已連結：'+selectedEntry.path:'⚠️ 此檔案在本地資料夾中不存在';
  }
});

// ═══════════════════════════════════════
//  手動選單一檔案
// ═══════════════════════════════════════
document.getElementById('manualPickBtn').onclick=()=>document.getElementById('manualInput').click();
document.getElementById('manualInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f) return;
  const name=f.name.replace('.bin','');
  const fakeRec={path:f.name,name,series:'手動選取',sub:''};
  localFileMap[f.name]=f;
  selectEntry(fakeRec);
  document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>b.disabled=false);
});

// ═══════════════════════════════════════
//  搜尋列
// ═══════════════════════════════════════
document.getElementById('mainSearch').addEventListener('input',e=>{mainQ=e.target.value.trim();renderGrid();});
document.getElementById('sideSearch').addEventListener('input',e=>{sideQ=e.target.value.trim();renderTree();});

// ═══════════════════════════════════════
//  BLE 傳送
// ═══════════════════════════════════════
const SVC='0000ff10-0000-1000-8000-00805f9b34fb';
const WRT='0000ff11-0000-1000-8000-00805f9b34fb';
const NTF='0000ff12-0000-1000-8000-00805f9b34fb';

async function doSend(){
  if(!selectedEntry) return;
  const file=localFileMap[selectedEntry.path];
  if(!file){showToast('請先「更新資料夾」連結本地檔案');return;}
  document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>b.disabled=true);
  try{
    setLog('正在搜尋 omllbolink…','busy');
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'omllbo'}],optionalServices:[SVC]});
    setLog('連線中…','busy');
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService(SVC);
    const wc=await svc.getCharacteristic(WRT);
    const nc=await svc.getCharacteristic(NTF);
    await nc.startNotifications();
    nc.addEventListener('characteristicvaluechanged',e=>{
      const hex=Array.from(new Uint8Array(e.target.value.buffer)).map(b=>b.toString(16).padStart(2,'0')).join(' ');
      setLog('裝置回應: '+hex,'ok');
    });
    const data=new Uint8Array(await file.arrayBuffer());
    setLog(`傳送中「${selectedEntry.name}」(${data.length} bytes)…`,'busy');
    for(let i=0;i<data.length;i+=20){
      await wc.writeValueWithoutResponse(data.slice(i,i+20));
      await new Promise(r=>setTimeout(r,30));
    }
    setLog(`✅ 傳送完成！「${selectedEntry.name}.bin」已寫入`,'ok');
    showToast('✅ 傳送完成！');
  }catch(err){
    setLog('❌ '+err.message,'err');
  }finally{
    if(selectedEntry){const f=localFileMap[selectedEntry.path];document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>b.disabled=!f);}
  }
}
document.getElementById('sendBtn').addEventListener('click',doSend);
document.getElementById('sendBtn2').addEventListener('click',doSend);

// ═══════════════════════════════════════
//  Toast
// ═══════════════════════════════════════
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ═══════════════════════════════════════
//  輔助工具
// ═══════════════════════════════════════
function setLog(msg,kind=''){const l=document.getElementById('logBar');l.textContent=msg;l.className='log'+(kind?' '+kind:'');}
function mk(tag,cls){const e=document.createElement(tag);e.className=cls;return e;}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function esc(s){return s.replace(/"/g,'&quot;');}

// ═══════════════════════════════════════
//  初始化啟動
// ═══════════════════════════════════════
buildTree();
renderGrid();
</script>
