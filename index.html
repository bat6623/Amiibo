<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amiibo 傳輸工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── 頂部標題 ── */
    header {
      background: #1a1a1a;
      border-bottom: 2px solid #e60012;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      font-size: 24px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    header small {
      font-size: 12px;
      color: #888;
      display: block;
    }

    /* ── 主要布局 ── */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 65px);
    }

    /* ── 左側資料夾面板 ── */
    .sidebar {
      background: #161616;
      border-right: 1px solid #2a2a2a;
      overflow-y: auto;
      padding: 12px 0;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 16px 8px;
    }

    /* 開啟資料夾按鈕 */
    .open-folder-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 12px 12px;
      padding: 10px 14px;
      background: #e60012;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: calc(100% - 24px);
    }
    .open-folder-btn:hover { background: #cc0010; }

    /* 分類項目 */
    .category-item {
      cursor: pointer;
      user-select: none;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      font-size: 13px;
      color: #ccc;
      transition: background 0.15s;
    }
    .category-header:hover { background: #222; }
    .category-header.active { background: #1e1e1e; color: #fff; }
    .category-header .icon { font-size: 16px; flex-shrink: 0; }
    .category-header .caret {
      margin-left: auto;
      font-size: 10px;
      color: #555;
      transition: transform 0.2s;
    }
    .category-header.open .caret { transform: rotate(90deg); }

    /* 子分類 */
    .subcategory-list {
      display: none;
    }
    .subcategory-list.open { display: block; }
    .subcategory-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 36px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      transition: background 0.15s;
    }
    .subcategory-item:hover { background: #1e1e1e; color: #fff; }
    .subcategory-item.selected { background: #1a2a3a; color: #5aacff; }

    /* ── 右側主面板 ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 搜尋列 */
    .search-bar {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #e60012; }
    .search-input::placeholder { color: #555; }

    /* 麵包屑 */
    .breadcrumb {
      background: #111;
      padding: 8px 16px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .breadcrumb span { color: #aaa; }

    /* 角色格線 */
    .character-grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .section-heading {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 0 10px;
      border-bottom: 1px solid #222;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .char-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .char-card:hover {
      background: #222;
      border-color: #e60012;
      transform: translateY(-2px);
    }
    .char-card.selected {
      background: #1a1a2e;
      border-color: #5aacff;
    }
    .char-card .emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 6px;
    }
    .char-card .name-en {
      font-size: 11px;
      color: #ccc;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .char-card .name-zh {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    .char-card .file-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #333;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      color: #666;
    }
    .char-card.has-file .file-badge {
      background: #1a3a1a;
      color: #4caf50;
    }

    /* 空白狀態 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: #555;
      text-align: center;
      gap: 12px;
    }
    .empty-state .big-icon { font-size: 48px; }
    .empty-state p { font-size: 14px; }
    .empty-state small { font-size: 12px; color: #444; }

    /* ── 底部傳輸面板 ── */
    .bottom-panel {
      background: #1a1a1a;
      border-top: 2px solid #2a2a2a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .selected-file-info {
      flex: 1;
      min-width: 0;
    }
    .selected-file-info .label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .selected-file-info .filename {
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .selected-file-info .filepath {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-send {
      background: #e60012;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { background: #cc0010; }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-manual-pick {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-manual-pick:hover { border-color: #aaa; color: #fff; }

    /* 狀態列 */
    .log-bar {
      background: #111;
      border-top: 1px solid #222;
      padding: 6px 20px;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
      font-family: monospace;
    }
    .log-bar.ok { color: #4caf50; }
    .log-bar.error { color: #f44336; }
    .log-bar.busy { color: #ffb300; }

    /* 隱藏原生 file input */
    #manualFileInput { display: none; }
    #folderInput { display: none; }

    /* 卷軸樣式 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* 響應式 */
    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🎮</span>
  <div>
    <h1>Amiibo 傳輸工具</h1>
    <small>omllbolink BLE 傳輸 · 選擇角色 → 連線寫入</small>
  </div>
</header>

<div class="layout">

  <!-- ═══════════════════════════════════
       左側：分類導覽
  ═══════════════════════════════════ -->
  <aside class="sidebar">
    <button class="open-folder-btn" id="openFolderBtn">
      📂 開啟 Amiibo Bin 資料夾
    </button>
    <div class="sidebar-title">系列分類</div>
    <div id="categoryTree">
      <!-- 由 JS 動態生成，或使用預設清單 -->
    </div>
  </aside>

  <!-- ═══════════════════════════════════
       右側：角色選擇 + 傳輸
  ═══════════════════════════════════ -->
  <div class="main">
    <div class="search-bar">
      <input class="search-input" id="searchInput" type="text" placeholder="搜尋角色名稱（英文或中文）…">
    </div>
    <div class="breadcrumb" id="breadcrumb">全部系列</div>
    <div class="character-grid" id="characterGrid">
      <div class="empty-state">
        <span class="big-icon">📂</span>
        <p>點擊左側「開啟 Amiibo Bin 資料夾」</p>
        <small>選擇包含 .bin 檔案的資料夾，或直接從下方手動選取單一檔案</small>
      </div>
    </div>
    <div class="bottom-panel">
      <div class="selected-file-info">
        <div class="label">已選擇的檔案</div>
        <div class="filename" id="selectedFileName">（尚未選擇）</div>
        <div class="filepath" id="selectedFilePath">請從上方角色列表點選，或手動選取 .bin 檔案</div>
      </div>
      <button class="btn-manual-pick" id="manualPickBtn" title="手動選取 .bin 檔案">
        📄 選擇檔案
      </button>
      <button class="btn-send" id="sendBtn" disabled>
        🔵 連線並傳送
      </button>
    </div>
    <div class="log-bar" id="logBar">就緒 — 請選擇角色並按下「連線並傳送」</div>
  </div>
</div>

<input type="file" id="manualFileInput" accept=".bin">
<input type="file" id="folderInput" webkitdirectory multiple accept=".bin">

    'Green Yarn Yoshi': '毛線耀西（綠）',
    'Light-Blue Yarn Yoshi': '毛線耀西（淺藍）',

    'Mega Yarn Yoshi': '巨大毛線耀西',
    'Poochy': '布奇（狗狗）',

    'ally-all-in-839': '通用金鑰（全839）',

  // 分類表情符號
  const CATEGORY_ICONS = {
    'Animal Crossing Amiibo': '🏝️',
    'Super Smash Bros Amiibo': '🥊',
    'The Legend of Zelda Amiibo': '🗡️',
    'Super Mario Amiibo': '🍄',
    'Kirby Amiibo': '⭐',
    'Splatoon Amiibo': '🦑',
    'Metroid Amiibo': '👾',
    'Fire Emblem Amiibo': '🔥',
    'Xenoblade Chronicles': '⚔️',
    'Pokemon': '🎮',
    'Monster Hunter Amiibo': '🐉',
    'Shovel Knight Amiibo': '⛏️',
    'Pikmin Amiibo': '🌱',
    'Mega Man Amiibo': '🤖',
    "Yoshi's Wooly World Amiibo": '🧶',
    'Dark Souls Amiibo': '💀',
    'Diablo Amiibo': '👿',
    'BoxBoy! Amiibo': '📦',
    'Chibi-Robo! Amiibo': '🤖',
    'Kellogs Amiibo': '🌟',
    'Skylanders Amiibo': '🌈',
    'Power Pros Amiibo': '⚾',
    'PowerUpBands': '🎡',
    'Mario Sports Superstars Amiibo': '🏆',
    'Detective Pikachu Amiibo': '🔍',
    "Pokkén Tournament Amiibo": '🥊',
    'Yu-Gi-Oh! Amiibo': '🃏',
    '!Essential Files': '🔑',
  };

  // ═══════════════════════════════════════════════════════
  //  狀態
  // ═══════════════════════════════════════════════════════
  let allFiles = [];        // { file: File, path: string, name: string }[]
  let selectedFile = null;
  let currentCategory = null;
  let currentSubcategory = null;
  let searchQuery = '';

  // ═══════════════════════════════════════════════════════
  //  DOM 參照
  // ═══════════════════════════════════════════════════════
  const categoryTree    = document.getElementById('categoryTree');
  const characterGrid   = document.getElementById('characterGrid');
  const breadcrumb      = document.getElementById('breadcrumb');
  const selectedFileName = document.getElementById('selectedFileName');
  const selectedFilePath = document.getElementById('selectedFilePath');
  const sendBtn         = document.getElementById('sendBtn');
  const logBar          = document.getElementById('logBar');
  const searchInput     = document.getElementById('searchInput');
  const manualFileInput = document.getElementById('manualFileInput');
  const folderInput     = document.getElementById('folderInput');

  // ═══════════════════════════════════════════════════════
  //  開啟資料夾（webkitdirectory）
  // ═══════════════════════════════════════════════════════
  document.getElementById('openFolderBtn').onclick = () => folderInput.click();

  folderInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    const binFiles = files.filter(f => f.name.endsWith('.bin'));
    if (binFiles.length === 0) {
      setLog('未在選擇的資料夾中找到 .bin 檔案', 'error');
      return;
    }
    allFiles = binFiles.map(f => ({
      file: f,
      // webkitRelativePath 格式：「資料夾名/子資料夾/檔案.bin」
      path: f.webkitRelativePath || f.name,
      name: f.name.replace('.bin', ''),
    }));
    setLog(`已載入 ${allFiles.length} 個 .bin 檔案`, 'ok');
    buildCategoryTree();
    renderGrid();
  });

  // ═══════════════════════════════════════════════════════
  //  手動選取單一 .bin
  // ═══════════════════════════════════════════════════════
  document.getElementById('manualPickBtn').onclick = () => manualFileInput.click();

  manualFileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    selectFile({ file: f, path: f.name, name: f.name.replace('.bin', '') });
  });

  // ═══════════════════════════════════════════════════════
  //  搜尋
  // ═══════════════════════════════════════════════════════
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderGrid();
  });

  // ═══════════════════════════════════════════════════════
  //  建立左側分類樹
  // ═══════════════════════════════════════════════════════
  function buildCategoryTree() {
    // 從 path 解析分類結構
    // 路徑格式：「Amiibo-main 2/Amiibo Bin/系列/子分類/檔案.bin」
    const tree = {}; // { 系列: { 子分類: [檔案] } }

    for (const f of allFiles) {
      const parts = f.path.split('/');
      // 找到 'Amiibo Bin' 的位置
      const binIdx = parts.findIndex(p => p === 'Amiibo Bin');
      if (binIdx === -1) {
        // 無法識別路徑，放到根分類
        const cat = '未分類';
        if (!tree[cat]) tree[cat] = { '全部': [] };
        tree[cat]['全部'].push(f);
        continue;
      }
      const afterBin = parts.slice(binIdx + 1);
      const category = afterBin[0] || '根目錄';
      const subcategory = afterBin.length > 2 ? afterBin[1] : '全部';

      if (!tree[category]) tree[category] = {};
      if (!tree[category][subcategory]) tree[category][subcategory] = [];
      tree[category][subcategory].push(f);
    }

    // 儲存樹狀結構供後續使用
    window._amiiboTree = tree;

    // 渲染 DOM
    categoryTree.innerHTML = '';

    // 加一個「全部」選項
    const allItem = document.createElement('div');
    allItem.className = 'category-header';
    allItem.innerHTML = `<span class="icon">🎮</span> 全部（${allFiles.length}）`;
    allItem.onclick = () => {
      currentCategory = null;
      currentSubcategory = null;
      document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
      allItem.classList.add('active');
      breadcrumb.textContent = '全部系列';
      renderGrid();
    };
    categoryTree.appendChild(allItem);

    for (const [cat, subs] of Object.entries(tree)) {
      const item = document.createElement('div');
      item.className = 'category-item';

      const totalInCat = Object.values(subs).flat().length;
      const icon = CATEGORY_ICONS[cat] || '📁';
      const header = document.createElement('div');
      header.className = 'category-header';
      header.innerHTML = `
        <span class="icon">${icon}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.replace(/ Amiibo$/,'')}</span>
        <span style="font-size:10px;color:#555;flex-shrink:0">${totalInCat}</span>
        <span class="caret">▶</span>
      `;

      const subList = document.createElement('div');
      subList.className = 'subcategory-list';

      const subKeys = Object.keys(subs);

      // 有多個子分類才顯示子列表
      if (subKeys.length > 1 || (subKeys.length === 1 && subKeys[0] !== '全部')) {
        // 點標題展開/收起
        header.onclick = () => {
          const isOpen = subList.classList.toggle('open');
          header.classList.toggle('open', isOpen);
          if (isOpen) {
            currentCategory = cat;
            currentSubcategory = null;
            document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
            header.classList.add('active', 'open');
            breadcrumb.textContent = cat;
            renderGrid();
          }
        };

        for (const [sub, files] of Object.entries(subs)) {
          const subItem = document.createElement('div');
          subItem.className = 'subcategory-item';
          subItem.innerHTML = `📁 ${sub} <span style="margin-left:auto;font-size:10px;color:#555">${files.length}</span>`;
          subItem.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.subcategory-item').forEach(el => el.classList.remove('selected'));
            subItem.classList.add('selected');
            currentCategory = cat;
            currentSubcategory = sub;
            breadcrumb.textContent = `${cat} › ${sub}`;
            renderGrid();
          };
          subList.appendChild(subItem);
        }
      } else {
        // 單層分類，直接點
        header.onclick = () => {
          document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.subcategory-item').forEach(el => el.classList.remove('selected'));
          header.classList.add('active');
          currentCategory = cat;
          currentSubcategory = null;
          breadcrumb.textContent = cat;
          renderGrid();
        };
      }

      item.appendChild(header);
      item.appendChild(subList);
      categoryTree.appendChild(item);
    }
  }

  // ═══════════════════════════════════════════════════════
  //  渲染角色格線
  // ═══════════════════════════════════════════════════════
  function renderGrid() {
    const tree = window._amiiboTree;

    let files = [];

    if (!tree) {
      characterGrid.innerHTML = `<div class="empty-state">
        <span class="big-icon">📂</span>
        <p>點擊左側「開啟 Amiibo Bin 資料夾」</p>
        <small>選擇包含 .bin 檔案的資料夾</small>
      </div>`;
      return;
    }

    if (currentCategory === null) {
      files = allFiles;
    } else if (currentSubcategory === null) {
      files = Object.values(tree[currentCategory] || {}).flat();
    } else {
      files = (tree[currentCategory] || {})[currentSubcategory] || [];
    }

    // 搜尋過濾
    if (searchQuery) {
      files = allFiles.filter(f => {
        const zhName = getZhName(f.name).toLowerCase();
        return f.name.toLowerCase().includes(searchQuery) || zhName.includes(searchQuery);
      });
      breadcrumb.textContent = `搜尋：${searchQuery}（${files.length} 筆）`;
    }

    if (files.length === 0) {
      characterGrid.innerHTML = `<div class="empty-state">
        <span class="big-icon">🔍</span>
        <p>找不到符合的角色</p>
      </div>`;
      return;
    }

    // 在搜尋或全部模式下，依分類分組
    if (!currentCategory || searchQuery) {
      renderGrouped(files);
    } else {
      renderFlat(files);
    }
  }

  function renderGrouped(files) {
    const tree = window._amiiboTree;
    // 先整理出哪些分類包含這些檔案
    const groups = {};
    for (const f of files) {
      const parts = f.path.split('/');
      const binIdx = parts.findIndex(p => p === 'Amiibo Bin');
      const cat = binIdx !== -1 ? (parts[binIdx + 1] || '根目錄') : '未分類';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(f);
    }

    let html = '';
    for (const [cat, catFiles] of Object.entries(groups)) {
      const icon = CATEGORY_ICONS[cat] || '📁';
      html += `<div class="section-heading">${icon} ${cat.replace(/ Amiibo$/,'')}</div>`;
      html += '<div class="grid">';
      for (const f of catFiles) {
        html += makeCard(f);
      }
      html += '</div>';
    }
    characterGrid.innerHTML = html;
    attachCardEvents();
  }

  function renderFlat(files) {
    let html = '<div class="grid">';
    for (const f of files) {
      html += makeCard(f);
    }
    html += '</div>';
    characterGrid.innerHTML = html;
    attachCardEvents();
  }

  function makeCard(f) {
    const zhName = getZhName(f.name);
    const isSelected = selectedFile && selectedFile.path === f.path;
    const emoji = getEmoji(f.name);
    return `
      <div class="char-card ${isSelected ? 'selected' : ''} has-file" data-path="${escapeAttr(f.path)}">
        <span class="file-badge">.bin</span>
        <span class="emoji">${emoji}</span>
        <div class="name-en">${escapeHtml(f.name)}</div>
        <div class="name-zh">${escapeHtml(zhName)}</div>
      </div>
    `;
  }

  function attachCardEvents() {
    document.querySelectorAll('.char-card').forEach(card => {
      card.addEventListener('click', () => {
        const path = card.dataset.path;
        const f = allFiles.find(x => x.path === path);
        if (f) selectFile(f);
      });
    });
  }

  // ═══════════════════════════════════════════════════════
  //  選擇檔案
  // ═══════════════════════════════════════════════════════
  function selectFile(f) {
    selectedFile = f;
    selectedFileName.textContent = f.name + '.bin';
    selectedFilePath.textContent = f.path;
    sendBtn.disabled = false;
    setLog(`已選擇：${f.name}`, 'ok');
    // 更新格線選中狀態
    document.querySelectorAll('.char-card').forEach(card => {
      card.classList.toggle('selected', card.dataset.path === f.path);
    });
  }

  // ═══════════════════════════════════════════════════════
  //  BLE 傳送
  // ═══════════════════════════════════════════════════════
  const SERVICE_UUID = '0000ff10-0000-1000-8000-00805f9b34fb';
  const WRITE_UUID   = '0000ff11-0000-1000-8000-00805f9b34fb';
  const NOTIFY_UUID  = '0000ff12-0000-1000-8000-00805f9b34fb';

  sendBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    sendBtn.disabled = true;

    try {
      setLog('正在搜尋 omllbolink 裝置…', 'busy');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'omllbo' }],
        optionalServices: [SERVICE_UUID]
      });

      setLog('連線中…', 'busy');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const writeChar = await service.getCharacteristic(WRITE_UUID);
      const notifyChar = await service.getCharacteristic(NOTIFY_UUID);

      await notifyChar.startNotifications();
      notifyChar.addEventListener('characteristicvaluechanged', (e) => {
        const bytes = new Uint8Array(e.target.value.buffer);
        const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
        setLog('裝置回應: ' + hex, 'ok');
      });

      const buffer = await selectedFile.file.arrayBuffer();
      const data = new Uint8Array(buffer);
      setLog(`開始傳送「${selectedFile.name}」，共 ${data.length} bytes…`, 'busy');

      for (let i = 0; i < data.length; i += 20) {
        const chunk = data.slice(i, i + 20);
        await writeChar.writeValueWithoutResponse(chunk);
        await new Promise(r => setTimeout(r, 30));
      }

      setLog(`✅ 傳送完成！「${selectedFile.name}.bin」已成功寫入`, 'ok');
    } catch (err) {
      setLog('❌ 錯誤: ' + err.message, 'error');
    } finally {
      sendBtn.disabled = false;
    }
  });

  // ═══════════════════════════════════════════════════════
  //  工具函式
  // ═══════════════════════════════════════════════════════
  function getZhName(name) {
    // 直接比對
    if (ZH_NAMES[name]) return ZH_NAMES[name];
    // 去掉後綴再比對
    const stripped = name.replace(/ \(.*\)$/, '').trim();
    if (ZH_NAMES[stripped]) return ZH_NAMES[stripped];
    return '—';
  }

  function getEmoji(name) {
    const n = name.toLowerCase();
    if (n.includes('mario') || n.includes('luigi') || n.includes('peach') || n.includes('toad') || n.includes('bowser')) return '🍄';
    if (n.includes('link') || n.includes('zelda') || n.includes('ganon')) return '🗡️';
    if (n.includes('pikachu') || n.includes('pokemon') || n.includes('charizard') || n.includes('mewtwo')) return '⚡';
    if (n.includes('kirby') || n.includes('dedede') || n.includes('meta knight')) return '⭐';
    if (n.includes('samus') || n.includes('metroid')) return '🚀';
    if (n.includes('fox') || n.includes('falco') || n.includes('wolf')) return '🦊';
    if (n.includes('donkey kong') || n.includes('diddy')) return '🦍';
    if (n.includes('splatoon') || n.includes('inkling') || n.includes('octoling')) return '🦑';
    if (n.includes('fire emblem') || n.includes('marth') || n.includes('ike') || n.includes('lucina')) return '⚔️';
    if (n.includes('sonic')) return '💨';
    if (n.includes('mega man')) return '🤖';
    if (n.includes('isabelle') || n.includes('tom nook') || n.includes('kk')) return '🏝️';
    if (n.includes('yoshi')) return '🥚';
    if (n.includes('wario') || n.includes('waluigi')) return '👿';
    if (n.includes('key') || n.includes('secret') || n.includes('essential')) return '🔑';
    if (n.includes('yu-gi') || n.includes('yugi')) return '🃏';
    if (n.includes('xenoblade')) return '⚔️';
    if (n.includes('pikmin')) return '🌱';
    if (n.includes('dark souls') || n.includes('solaire')) return '☀️';
    return '🎮';
  }

  function setLog(msg, kind = '') {
    logBar.textContent = msg;
    logBar.className = 'log-bar' + (kind ? ' ' + kind : '');
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s) {
    return s.replace(/"/g,'&quot;');
  }
</script>
