<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amiibo 傳輸工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      border-bottom: 2px solid #e60012;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 24px; }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header small { font-size: 12px; color: #888; display: block; }
    .api-status {
      margin-left: auto;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #222;
      color: #666;
      white-space: nowrap;
    }
    .api-status.ok { background: #1a2e1a; color: #4caf50; }
    .api-status.loading { background: #2a2a1a; color: #ffb300; }
    .api-status.error { background: #2e1a1a; color: #f44336; }

    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      height: calc(100vh - 63px);
    }

    /* ── 左側 ── */
    .sidebar {
      background: #161616;
      border-right: 1px solid #2a2a2a;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .open-folder-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 12px 10px;
      padding: 10px 14px;
      background: #e60012;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: calc(100% - 24px);
      transition: background 0.2s;
    }
    .open-folder-btn:hover { background: #cc0010; }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 16px 6px;
    }
    .category-item { cursor: pointer; user-select: none; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      font-size: 13px;
      color: #ccc;
      transition: background 0.15s;
    }
    .category-header:hover { background: #222; }
    .category-header.active { background: #1e1e1e; color: #fff; }
    .category-header .icon { font-size: 15px; flex-shrink: 0; }
    .category-header .caret { margin-left: auto; font-size: 10px; color: #555; transition: transform 0.2s; }
    .category-header.open .caret { transform: rotate(90deg); }
    .subcategory-list { display: none; }
    .subcategory-list.open { display: block; }
    .subcategory-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px 6px 36px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      transition: background 0.15s;
    }
    .subcategory-item:hover { background: #1e1e1e; color: #fff; }
    .subcategory-item.selected { background: #1a2a3a; color: #5aacff; }

    /* ── 右側 ── */
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .search-bar {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #e60012; }
    .search-input::placeholder { color: #555; }
    .breadcrumb {
      background: #111;
      padding: 7px 16px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .character-grid {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    .section-heading {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 0 8px;
      border-bottom: 1px solid #1e1e1e;
      margin-bottom: 10px;
      margin-top: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    /* ── 卡片 ── */
    .char-card {
      background: #1a1a1a;
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 8px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .char-card:hover {
      background: #222;
      border-color: #e60012;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(230,0,18,0.2);
    }
    .char-card.selected {
      background: #1a1a2e;
      border-color: #5aacff;
      box-shadow: 0 0 0 2px rgba(90,172,255,0.2);
    }
    /* 圖片容器 */
    .card-img-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .card-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
      transition: opacity 0.3s;
    }
    .card-img.loading { opacity: 0; }
    .card-img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      opacity: 0.5;
    }

      color: #ccc;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .char-card .name-zh {

      color: #777;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-badge {

      top: 5px;
      right: 5px;
      background: #1a3a1a;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 8px;
      color: #4caf50;
    }

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 280px;
      color: #555;
      text-align: center;
      gap: 10px;

    .empty-state small { font-size: 12px; color: #444; }

      align-items: center;
      gap: 12px;

      border-radius: 8px;

      align-items: center;

      font-weight: 700;

<script>
// ═══════════════════════════════════════════════
//  AmiiboAPI 圖片對應（啟動時從 API 抓取）
// ═══════════════════════════════════════════════
let amiiboApiData = [];   // 完整的 API 資料陣列
let apiImageMap = {};     // { 正規化名稱 → imageUrl }

async function loadAmiiboApi() {
  const statusEl = document.getElementById('apiStatus');
  try {
    const res = await fetch('https://amiiboapi.com/api/amiibo/', { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    amiiboApiData = json.amiibo || [];

    // 建立名稱 → 圖片 的映射（小寫 key，方便模糊比對）
    for (const a of amiiboApiData) {
      const key = normKey(a.name);
      if (!apiImageMap[key]) apiImageMap[key] = a.image;
      // 也用 character 建索引
      const ckey = normKey(a.character);
      if (!apiImageMap[ckey]) apiImageMap[ckey] = a.image;
    }

    statusEl.textContent = `✅ 已載入 ${amiiboApiData.length} 筆圖片`;
    statusEl.className = 'api-status ok';
    // 若格線已顯示，刷新一次讓圖片補上
    if (window._amiiboTree) renderGrid();
  } catch (e) {
    statusEl.textContent = '⚠️ 圖片 API 離線，改用 emoji';
    statusEl.className = 'api-status error';
  }
}

function normKey(s) {
  return (s || '').toLowerCase()
    .replace(/[^a-z0-9]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/** 從檔名找最匹配的 API 圖片 URL */
function getApiImage(fileName) {
  if (!amiiboApiData.length) return null;
  const key = normKey(fileName);
  // 1. 完全匹配
  if (apiImageMap[key]) return apiImageMap[key];
  // 2. API 資料逐筆比對：用名稱包含
  const parts = key.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  for (const a of amiiboApiData) {
    const akey = normKey(a.name);
    const ckey = normKey(a.character);
    // 計算共同 token 數
    const score = parts.filter(p => akey.includes(p) || ckey.includes(p)).length;
    if (score > bestScore && score >= Math.max(1, Math.floor(parts.length * 0.6))) {
      bestScore = score;
      best = a.image;
    }
  }
  return best;
}

function getEmojiFallback(name) {
  const n = name.toLowerCase();
  if (n.match(/mario|luigi|peach|toad|bowser/)) return '🍄';
  if (n.match(/link|zelda|ganon/)) return '🗡️';
  if (n.match(/pikachu|pokemon|charizard|mewtwo|greninja/)) return '⚡';
  if (n.match(/kirby|dedede|meta knight/)) return '⭐';
  if (n.match(/samus|metroid/)) return '🚀';
  if (n.match(/fox|falco|wolf/)) return '🦊';
  if (n.match(/donkey kong|diddy/)) return '🦍';
  if (n.match(/inkling|splatoon|octoling/)) return '🦑';
  if (n.match(/sonic/)) return '💨';
  if (n.match(/mega man/)) return '🤖';
  if (n.match(/isabelle|tom nook|k\.k/)) return '🏝️';
  if (n.match(/yoshi/)) return '🥚';
  if (n.match(/key|secret|essential/)) return '🔑';
  if (n.match(/yu.gi|yugi/)) return '🃏';
  return '🎮';
}

// ═══════════════════════════════════════════════
//  狀態
// ═══════════════════════════════════════════════
let allFiles = [];
let selectedFile = null;
let currentCategory = null;
let currentSubcategory = null;
let searchQuery = '';

const categoryTree    = document.getElementById('categoryTree');
const characterGrid   = document.getElementById('characterGrid');
const breadcrumb      = document.getElementById('breadcrumb');
const selectedFileName = document.getElementById('selectedFileName');
const selectedFilePath = document.getElementById('selectedFilePath');
const selectedPreview  = document.getElementById('selectedPreview');
const sendBtn         = document.getElementById('sendBtn');
const logBar          = document.getElementById('logBar');
const searchInput     = document.getElementById('searchInput');
const manualFileInput = document.getElementById('manualFileInput');
const folderInput     = document.getElementById('folderInput');

// 啟動時立即抓 API
loadAmiiboApi();

// ═══════════════════════════════════════════════
//  開啟資料夾
// ═══════════════════════════════════════════════
document.getElementById('openFolderBtn').onclick = () => folderInput.click();

folderInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files).filter(f => f.name.endsWith('.bin'));
  if (!files.length) { setLog('未找到 .bin 檔案', 'error'); return; }
  allFiles = files.map(f => ({
    file: f,
    path: f.webkitRelativePath || f.name,
    name: f.name.replace('.bin', ''),
  }));
  setLog(`已載入 ${allFiles.length} 個 .bin 檔案`, 'ok');
  buildCategoryTree();
  renderGrid();
});

// ═══════════════════════════════════════════════
//  手動選單一檔案
// ═══════════════════════════════════════════════
document.getElementById('manualPickBtn').onclick = () => manualFileInput.click();
manualFileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  selectFile({ file: f, path: f.name, name: f.name.replace('.bin', '') });
});

// ═══════════════════════════════════════════════
//  搜尋
// ═══════════════════════════════════════════════
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  renderGrid();
});

// ═══════════════════════════════════════════════
//  建立分類樹
// ═══════════════════════════════════════════════
function buildCategoryTree() {
  const tree = {};
  for (const f of allFiles) {
    const parts = f.path.split('/');
    const binIdx = parts.findIndex(p => p === 'Amiibo Bin');
    if (binIdx === -1) {
      if (!tree['未分類']) tree['未分類'] = { '全部': [] };
      tree['未分類']['全部'].push(f);
      continue;
    }
    const after = parts.slice(binIdx + 1);
    const cat = after[0] || '根目錄';
    const sub = after.length > 2 ? after[1] : '全部';
    if (!tree[cat]) tree[cat] = {};
    if (!tree[cat][sub]) tree[cat][sub] = [];
    tree[cat][sub].push(f);
  }
  window._amiiboTree = tree;

  categoryTree.innerHTML = '';

  // 全部
  const allItem = document.createElement('div');
  allItem.className = 'category-header';
  allItem.innerHTML = `<span class="icon">🎮</span> <span style="flex:1">全部</span> <span style="font-size:10px;color:#555">${allFiles.length}</span>`;
  allItem.onclick = () => {
    setActive(allItem);
    currentCategory = currentSubcategory = null;
    breadcrumb.textContent = '全部系列';
    renderGrid();
  };
  categoryTree.appendChild(allItem);

  for (const [cat, subs] of Object.entries(tree)) {
    const item = document.createElement('div');
    item.className = 'category-item';
    const total = Object.values(subs).flat().length;
    const icon = CATEGORY_ICONS[cat] || '📁';
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="icon">${icon}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.replace(/ Amiibo$/,'')}</span>
      <span style="font-size:10px;color:#555;flex-shrink:0">${total}</span>
      <span class="caret">▶</span>
    `;
    const subList = document.createElement('div');
    subList.className = 'subcategory-list';
    const subKeys = Object.keys(subs);

    if (subKeys.length > 1 || (subKeys[0] && subKeys[0] !== '全部')) {
      header.onclick = () => {
        const isOpen = subList.classList.toggle('open');
        header.classList.toggle('open', isOpen);
        setActive(header);
        currentCategory = cat; currentSubcategory = null;
        breadcrumb.textContent = cat;
        renderGrid();
      };
      for (const [sub, flist] of Object.entries(subs)) {
        const si = document.createElement('div');
        si.className = 'subcategory-item';
        si.innerHTML = `📁 ${sub} <span style="margin-left:auto;font-size:10px;color:#555">${flist.length}</span>`;
        si.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll('.subcategory-item').forEach(el => el.classList.remove('selected'));
          si.classList.add('selected');
          currentCategory = cat; currentSubcategory = sub;
          breadcrumb.textContent = `${cat} › ${sub}`;
          renderGrid();
        };
        subList.appendChild(si);
      }
    } else {
      header.onclick = () => {
        setActive(header);
        currentCategory = cat; currentSubcategory = null;
        breadcrumb.textContent = cat;
        renderGrid();
      };
    }
    item.appendChild(header);
    item.appendChild(subList);
    categoryTree.appendChild(item);
  }
}

function setActive(el) {
  document.querySelectorAll('.category-header').forEach(h => h.classList.remove('active'));
  el.classList.add('active');
}

// ═══════════════════════════════════════════════
//  渲染格線
// ═══════════════════════════════════════════════
function renderGrid() {
  const tree = window._amiiboTree;
  if (!tree) {
    characterGrid.innerHTML = `<div class="empty-state"><span class="big-icon">📂</span><p>點擊左側「開啟 Amiibo Bin 資料夾」</p></div>`;
    return;
  }

  let files = [];
  if (currentCategory === null) files = allFiles;
  else if (currentSubcategory === null) files = Object.values(tree[currentCategory] || {}).flat();
  else files = (tree[currentCategory] || {})[currentSubcategory] || [];

  if (searchQuery) {
    files = allFiles.filter(f => {
      const zh = getZhName(f.name).toLowerCase();
      return f.name.toLowerCase().includes(searchQuery) || zh.includes(searchQuery);
    });
    breadcrumb.textContent = `搜尋：${searchQuery}（${files.length} 筆）`;
  }

  if (!files.length) {
    characterGrid.innerHTML = `<div class="empty-state"><span class="big-icon">🔍</span><p>找不到符合的角色</p></div>`;
    return;
  }

  if (!currentCategory || searchQuery) {
    renderGrouped(files);
  } else {
    renderFlat(files);
  }
}

function renderGrouped(files) {
  const groups = {};
  for (const f of files) {
    const parts = f.path.split('/');
    const binIdx = parts.findIndex(p => p === 'Amiibo Bin');
    const cat = binIdx !== -1 ? (parts[binIdx + 1] || '根目錄') : '未分類';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(f);
  }
  let html = '';
  for (const [cat, cf] of Object.entries(groups)) {
    const icon = CATEGORY_ICONS[cat] || '📁';
    html += `<div class="section-heading">${icon} ${cat.replace(/ Amiibo$/,'')}</div><div class="grid">`;
    for (const f of cf) html += makeCard(f);
    html += '</div>';
  }
  characterGrid.innerHTML = html;
  attachCardEvents();
  lazyLoadImages();
}

function renderFlat(files) {
  characterGrid.innerHTML = `<div class="grid">${files.map(makeCard).join('')}</div>`;
  attachCardEvents();
  lazyLoadImages();
}

function makeCard(f) {
  const zhName = getZhName(f.name);
  const isSelected = selectedFile && selectedFile.path === f.path;
  const emoji = getEmojiFallback(f.name);
  const safeId = CSS.escape(f.path);
  return `
    <div class="char-card ${isSelected ? 'selected' : ''}" data-path="${escAttr(f.path)}">
      <span class="file-badge">.bin</span>
      <div class="card-img-wrap" data-name="${escAttr(f.name)}">
        <span class="card-img-placeholder">${emoji}</span>
        <img class="card-img loading" src="" alt="${escAttr(f.name)}" data-name="${escAttr(f.name)}">
      </div>
      <div class="name-en">${escHtml(f.name)}</div>
      <div class="name-zh">${escHtml(zhName)}</div>
    </div>`;
}

// ═══════════════════════════════════════════════
//  延遲載入圖片（IntersectionObserver）
// ═══════════════════════════════════════════════
let observer;
function lazyLoadImages() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      if (img.dataset.loaded) continue;
      const name = img.dataset.name;
      const url = getApiImage(name);
      if (url) {
        img.onload = () => {
          img.classList.remove('loading');
          // 隱藏 emoji placeholder
          const placeholder = img.previousElementSibling;
          if (placeholder) placeholder.style.display = 'none';
          img.dataset.loaded = '1';
        };
        img.onerror = () => img.classList.remove('loading');
        img.src = url;
      } else {
        img.classList.remove('loading');
        img.dataset.loaded = '1';
      }
      observer.unobserve(img);
    }
  }, { rootMargin: '100px' });

  document.querySelectorAll('.card-img').forEach(img => observer.observe(img));
}

function attachCardEvents() {
  document.querySelectorAll('.char-card').forEach(card => {
    card.addEventListener('click', () => {
      const f = allFiles.find(x => x.path === card.dataset.path);
      if (f) selectFile(f);
    });
  });
}

// ═══════════════════════════════════════════════
//  選擇檔案
// ═══════════════════════════════════════════════
function selectFile(f) {
  selectedFile = f;
  selectedFileName.textContent = f.name + '.bin';
  selectedFilePath.textContent = f.path;
  sendBtn.disabled = false;
  setLog(`已選擇：${f.name}.bin`, 'ok');

  // 更新底部預覽圖
  const imgUrl = getApiImage(f.name);
  if (imgUrl) {
    selectedPreview.src = imgUrl;
    selectedPreview.className = 'selected-preview show';
  } else {
    selectedPreview.className = 'selected-preview';
  }

  document.querySelectorAll('.char-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.path === f.path);
  });
}

// ═══════════════════════════════════════════════
//  BLE 傳送
// ═══════════════════════════════════════════════
const SERVICE_UUID = '0000ff10-0000-1000-8000-00805f9b34fb';
const WRITE_UUID   = '0000ff11-0000-1000-8000-00805f9b34fb';
const NOTIFY_UUID  = '0000ff12-0000-1000-8000-00805f9b34fb';

sendBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  sendBtn.disabled = true;
  try {
    setLog('正在搜尋 omllbolink 裝置…', 'busy');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'omllbo' }],
      optionalServices: [SERVICE_UUID]
    });
    setLog('連線中…', 'busy');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const writeChar = await service.getCharacteristic(WRITE_UUID);
    const notifyChar = await service.getCharacteristic(NOTIFY_UUID);
    await notifyChar.startNotifications();
    notifyChar.addEventListener('characteristicvaluechanged', (e) => {
      const hex = Array.from(new Uint8Array(e.target.value.buffer))
        .map(b => b.toString(16).padStart(2,'0')).join(' ');
      setLog('裝置回應: ' + hex, 'ok');
    });
    const data = new Uint8Array(await selectedFile.file.arrayBuffer());
    setLog(`傳送中「${selectedFile.name}」(${data.length} bytes)…`, 'busy');
    for (let i = 0; i < data.length; i += 20) {
      await writeChar.writeValueWithoutResponse(data.slice(i, i + 20));
      await new Promise(r => setTimeout(r, 30));
    }
    setLog(`✅ 傳送完成！「${selectedFile.name}.bin」已成功寫入`, 'ok');
  } catch (err) {
    setLog('❌ 錯誤: ' + err.message, 'error');
  } finally {
    sendBtn.disabled = false;
  }
});

// ═══════════════════════════════════════════════
//  工具函式
// ═══════════════════════════════════════════════
function getZhName(name) {
  if (ZH_NAMES[name]) return ZH_NAMES[name];
  const stripped = name.replace(/ \(.*\)$/, '').trim();
  return ZH_NAMES[stripped] || '—';
}
function setLog(msg, kind = '') {
  logBar.textContent = msg;
  logBar.className = 'log-bar' + (kind ? ' ' + kind : '');
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/"/g,'&quot;'); }
</script>
